<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workaholic - Painel Kanban</title>
  <style>
    :root {
      --bg:            #0f172a;
      --panel:         #1e293b;
      --panel-2:       #273449;
      --text:          #e5e7eb;
      --text-dim:      #9ca3af;
      --border:        #334155;
      --accent:        #3b82f6;
      --shadow:        0 4px 14px rgba(0,0,0,.25);

      --col-pending:   #6366f1;
      --col-active:    #f59e0b;
      --col-win:       #22c55e;
      --col-lose:      #ef4444;
      --col-archive:   #64748b;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
    header .stats { color: var(--text-dim); font-size: 13px; }
    header .spacer { flex: 1; }
    header button {
      background: var(--accent); color: #fff; border: 0;
      padding: 7px 14px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 600;
    }
    header button:hover { filter: brightness(1.1); }
    header button.secondary {
      background: transparent; border: 1px solid var(--border);
      color: var(--text);
    }

    .kanban-scroll {
      width: 100%;
      height: calc(100vh - 56px);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .kanban-scroll::-webkit-scrollbar          { height: 10px; }
    .kanban-scroll::-webkit-scrollbar-track    { background: transparent; }
    .kanban-scroll::-webkit-scrollbar-thumb    { background: var(--border); border-radius: 5px; }
    .kanban-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }

    .kanban-board {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 280px;
      gap: 14px;
      height: 100%;
      min-width: max-content;
    }

    .col {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .col__header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .3px;
    }
    .col__header::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--col-pending);
      box-shadow: 0 0 0 3px rgba(99,102,241,.18);
    }
    .col__count {
      margin-left: auto;
      background: rgba(255,255,255,.06);
      color: var(--text-dim);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .col[data-status="Candidatado"]   .col__header::before { background: var(--col-pending); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
    .col[data-status="Em Analise"]    .col__header::before { background: var(--col-pending); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
    .col[data-status="Entrevista"]    .col__header::before { background: var(--col-active);  box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
    .col[data-status="Teste Tecnico"] .col__header::before { background: var(--col-active);  box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
    .col[data-status="Proposta"]      .col__header::before { background: var(--col-active);  box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
    .col[data-status="Aprovado"]      .col__header::before { background: var(--col-win);     box-shadow: 0 0 0 3px rgba(34,197,94,.18);  }
    .col[data-status="Rejeitado"]     .col__header::before { background: var(--col-lose);    box-shadow: 0 0 0 3px rgba(239,68,68,.18);  }
    .col[data-status="Arquivado"]     .col__header::before { background: var(--col-archive); box-shadow: 0 0 0 3px rgba(100,116,139,.18);}

    .col[data-status="Aprovado"]  { border-top: 2px solid var(--col-win); }
    .col[data-status="Rejeitado"] { border-top: 2px solid var(--col-lose); opacity: .94; }
    .col[data-status="Arquivado"] { border-top: 2px solid var(--col-archive); opacity: .80; }
    .col[data-status="Entrevista"],
    .col[data-status="Teste Tecnico"],
    .col[data-status="Proposta"]  { border-top: 2px solid var(--col-active); }
    .col[data-status="Candidatado"],
    .col[data-status="Em Analise"] { border-top: 2px solid var(--col-pending); }

    .col__body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .col__body.is-drop-target {
      background: rgba(59,130,246,.10);
      outline: 2px dashed var(--accent);
      outline-offset: -6px;
    }

    .card {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: grab;
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    }
    .card:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,.3); }
    .card:active { cursor: grabbing; }
    .card.is-dragging { opacity: .45; }
    .card__title   { font-weight: 600; font-size: 13px; margin: 0 0 4px; }
    .card__company { color: var(--text-dim); font-size: 12px; margin: 0 0 6px; }
    .card__meta    { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); }
    .card__meta b  { color: var(--text); font-weight: 500; }
    .card__actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .card__actions button {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .card__actions button:hover { background: rgba(255,255,255,.10); }
    .card__actions button.danger { color: #fca5a5; }
    .card__actions button.danger:hover { background: rgba(239,68,68,.15); }
    .card__link { display: inline-block; margin-top: 6px; color: var(--accent); font-size: 11px; text-decoration: none; }
    .card__link:hover { text-decoration: underline; }

    .empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      padding: 18px 8px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      margin: 6px 4px;
    }

    .toast {
      position: fixed;
      bottom: 18px; right: 18px;
      background: #1f2937;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 50;
      border-left: 4px solid #22c55e;
    }
    .toast.is-visible { opacity: 1; transform: translateY(0); }
    .toast.is-error { border-left-color: var(--col-lose); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.is-open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      max-width: 560px;
      width: 92%;
      max-height: 80vh;
      overflow: auto;
      box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 10px; font-size: 15px; }
    .modal pre {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: var(--text);
    }
    .modal__actions {
      display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end;
    }
    .modal__actions button {
      background: var(--accent); color: #fff; border: 0;
      padding: 7px 14px; border-radius: 6px; cursor: pointer;
      font-size: 13px;
    }
    .modal__actions button.secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
  </style>
</head>
<body>

<header>
  <h1>Workaholic - Painel Kanban</h1>
  <span class="stats" id="stats">0 candidaturas</span>
  <span class="spacer"></span>
  <button id="export-btn" class="secondary" title="Exportar JSON">Exportar</button>
  <button id="import-btn" class="secondary" title="Importar JSON">Importar</button>
  <button id="refresh-btn">Atualizar</button>
</header>

<main class="kanban-scroll">
  <div class="kanban-board" id="board"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Mensagem</h2>
    <pre id="modal-body"></pre>
    <div class="modal__actions">
      <button class="secondary" id="modal-close">Fechar</button>
      <button id="modal-copy">Copiar</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept="application/json" hidden />

<script src="../libs/browser-polyfill.js"></script>
<script src="../shared/followup-rules.js"></script>
<script src="../shared/applications.js"></script>
<script src="../shared/portfolio.js"></script>
<script src="../shared/followup-message.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
